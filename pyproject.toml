[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai-identity-oidc"
version = "0.1.0"
description = "Validate-only OIDC identity provider for the TAI ecosystem: an installable plugin that registers itself as the \"identity-oidc\" identity provider and resolves an issuer-minted JWT to an authenticated identity (no key minting, no stored state)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["tai", "identity", "authentication", "oidc", "jwt", "access-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract the provider registers through: the identity
    # ABCs (IdentityProvider, IdentityProviderSettings, AuthIdentity) and the
    # module-level identity-provider registry.
    "tai-contract>=0.1,<0.2",
    # The OIDC discovery / JWKS / JWT-verify helper (tai_kit.net.jwt). The `jwt`
    # extra is REQUIRED, not optional: that module imports joserfc at module top,
    # so tai-kit[jwt] must resolve for this plugin to import. NO redis extra —
    # this provider validates only and holds no state.
    "tai-kit[jwt]>=0.1,<0.2",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai-identity-oidc"
Issues = "https://github.com/tai42ai/tai-identity-oidc/issues"
Changelog = "https://github.com/tai42ai/tai-identity-oidc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Public dev/test tooling.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai_identity_oidc*"]

[tool.setuptools.package-data]
tai_identity_oidc = ["py.typed"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai_skeleton".msg = "tai-identity-oidc is a contract-facing plugin: it never imports tai-skeleton."

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["tai_identity_oidc"]

[tool.coverage.report]
fail_under = 95

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = "warning"
